services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl
    command: >-
      sh -c "if [ ! -f /etc/nginx/ssl/key.pem ]; then
      openssl req -x509 -newkey rsa:2048 -sha256 -nodes
      -keyout /etc/nginx/ssl/key.pem -out /etc/nginx/ssl/cert.pem
      -days 365 -subj '/CN=localhost'
      -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' > /dev/null 2>&1; fi;
      nginx -g 'daemon off;'"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "4321"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile.prod
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - DB_SSLMODE=require
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    build:
      context: ./sql-database
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    expose:
      - "5432"
    volumes:
      - ./sql-database/init.sql:/docker-entrypoint-initdb.d/10-init.sql
      - postgres_data:/var/lib/postgresql/data
      - postgres_ssl:/var/lib/postgresql/ssl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_ssl:
